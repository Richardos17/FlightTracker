# .github/workflows/fetch-prices.yml
name: Fetch flight prices
on:
  schedule:
    - cron: '0 7,13,19 * * *'  # 3× daily

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST https://flight-tracker-seven-pi/api/cron/fetch-prices \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
